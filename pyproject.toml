[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Dan-PyInspect"
version = "5.0.0"
description = "A blazing fast Python project analyzer with a C core engine"
readme = "README.md"
authors = [
    { name = "Dan Studios" }
]
requires-python = ">=3.8"

[project.scripts]
pyinspect = "pyinspect.cli:main"
