name: Test Local Install

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies and build C extension locally
        run: |
          python -m pip install --upgrade pip
          pip install --editable .

      - name: Verify pyinspect CLI works
        run: |
          pyinspect --help
          
